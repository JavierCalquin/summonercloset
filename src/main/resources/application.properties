spring.application.name=summonercloset

# Lee las credenciales desde el archivo .env
spring.config.import=optional:file:.env[.properties]

# Conexion a Oracle (APEX)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate crea y actualiza las tablas a partir de las clases @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:8080}


app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}